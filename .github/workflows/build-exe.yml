name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "AI_Arxitektor_Pro" --hidden-import="PIL._tkinter_finder" --hidden-import="matplotlib.backends.backend_tkagg" --collect-all matplotlib main.py

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AI_Arxitektor_Pro_EXE
        path: dist/AI_Arxitektor_Pro.exe
